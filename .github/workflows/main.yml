name: Sync Bolpatra Notices

on:
  schedule:
    # Every 30 minutes. Adjust frequency as needed — GitHub Actions cron
    # can drift a few minutes under load, which is fine for this use case.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Bolpatra sync
        run: npx tsx scripts/scrape-bolpatra.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
